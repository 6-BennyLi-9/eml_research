name: Auto Update RAW
on: 
  workflow_call:
  push:
    branches:
      - main
jobs:
  main:
    name: main
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: update
      run: |
        git config --global user.name "Github Actions"
        git config --global user.email "actions@github.com"

        git checkout -b raw
        git merge main

        rm -rf .idea

        git add .
        git commit --allow-empty -m "Auto Update"
        git push origin raw
